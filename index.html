<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Guide • Premium</title>  
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
    // Инициализация WebApp
    let tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть на весь экран
</script>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Montserrat', sans-serif; background: #0b0e14; color: white; }
</style>
</head>
<body>

<button class="settings-trigger" onclick="toggleSlide()" >⚙️</button>

<div id="slide-menu" class="slide-menu">
    <div class="menu-header">
        <h3 style="margin:0;">Настройки</h3>
        <button class="menu-close-btn" onclick="toggleSlide()" style="background:none; border:none; color:var(--text-main);">✕</button>
    </div>
    
    <div class="menu-content">
        <div class="setting-item">
            <span>🔔 Уведомления</span>
            <div class="toggle-switch" id="notif-switch" onclick="toggleSetting('notifications')"><div class="toggle-knob"></div></div>
        </div>
        
        <div class="setting-item">
            <span>🔊 Звуки</span>
            <div class="toggle-switch" id="sound-switch" onclick="toggleSetting('sounds')"><div class="toggle-knob"></div></div>
        </div>
       <div class="banner"><img src="./img/banner.png" alt=""></div>
        <button class="reset-btn-hard" onclick="hardReset()">🗑️ Сбросить все данные</button>
    </div>
</div>


<div class="brand-header">
    <div class="brand-logo">
        <h1 id="page-title">ФАРМ BP</h1>
        <span id="page-subtitle">Premium Guid</span>
    </div>
</div>

<section id="farm-section">
    <div class="dashboard">
        <div class="dash-grid">
            <div class="dash-item"><span class="lbl">Нафармлено BP</span><span class="val cyan" id="stat-bp">0</span></div>
            <div class="dash-item"><span class="lbl">Активность</span><span class="val" id="stat-hours">00:00:00</span></div>
            <div class="dash-item" style="grid-column: span 2;"><span class="lbl">Текущий тип множителя</span><span class="val orange" id="stat-mult-text">Базовый (х1)</span></div>
        </div>  
        <div class="mult-selector-wrapper">
            <button class="mult-toggle-btn server-btn" id="toggle-server" onclick="toggleModifier('server')">х2 Сервер</button>
            <button class="mult-toggle-btn vip-btn" id="toggle-vip" onclick="toggleModifier('vip')">VIP Gold/Platinum</button>
        </div>
        
    </div>

<div class="online-hub">
    <div class="progress-wrapper">
        <div class="bar-fill" id="time-bar" style="width: 0%;"></div>
    </div>
    
<div class="time-input-container" style="display: flex; gap: 5px; justify-content: center; margin: 10px 0;">
    <input type="number" id="inp-h" placeholder="00" min="0" max="99" class="t-inp" onchange="initTimerFromInput()">
    <span style="align-self: center; font-weight: bold;"></span>
    <input type="number" id="inp-m" placeholder="00" min="0" max="59" class="t-inp" onchange="initTimerFromInput()">
    <span style="align-self: center; font-weight: bold;"></span>
    <input type="number" id="inp-s" placeholder="00" min="0" max="59" class="t-inp" onchange="initTimerFromInput()">
</div>

    <div class="controls-row">
        <div class="auto-toggle-container">
            <div class="toggle-switch" id="auto-run-switch" onclick="toggleAutoRun()">
                <div class="toggle-knob"></div>
            </div>
            <small>АВТО</small>
        </div>
        <button class="btn-trigger" id="time-btn" onclick="controlOnline()">СТАРТ</button>
    </div>

    <button class="btn-reset-session" onclick="resetSession()">↺ Сбросить Сессию</button>
</div>

    <div class="category-scroller">
        <button class="cat-tab active" id="tab-easy" onclick="selectCategory('easy')">🟢 Простые</button>
        <button class="cat-tab" id="tab-medium" onclick="selectCategory('medium')">🟡 Средние</button>
        <button class="cat-tab" id="tab-hard" onclick="selectCategory('hard')">🔴 Сложные</button>
        <button class="cat-tab" id="tab-pairs" onclick="selectCategory('pairs')">👥 Парные</button>
        <button class="cat-tab" id="tab-fraction" onclick="selectCategory('fraction')">🏛️ Фракция</button>
    </div>
<button class="btn-reset-tasks" onclick="resetAllDoneTasks()">↺ Сброс заданий</button>
    <div class="feed-container" id="feed-box"></div>
</section>

<div id="skills-section" style="display: none;">
    <div class="feed-container" id="skills-container" style="padding: 16px;"></div>
</div>

<div class="nav-dock">
    <button class="nav-node active" id="nav-farm" onclick="switchMainView('farm')"><span class="ico">🌌</span>Фарм</button>
    <button class="nav-node" id="nav-achievements" onclick="switchMainView('achievements')"><span class="ico">🏆</span>Достижения</button>
    <button class="nav-node" id="nav-skills" onclick="switchMainView('skills')"><span class="ico">⏳</span>Навыки</button>
    <button class="nav-node" id="nav-timers" onclick="switchMainView('timers')"><span class="ico">⏱️</span>Таймеры</button>
    <button class="nav-node" id="nav-games" onclick="switchMainView('games')"><span class="ico">🎮</span>Игры</button>
    </div>



<section id="timers-section" style="padding: 15px;">
    <div class="stats-row">
        <div class="stat-card"><span>Всего</span><b id="total-timers">0</b></div>
        <div class="stat-card"><span>Активны</span><b id="active-timers">0</b></div>
        <div class="stat-card"><span>Готовы</span><b id="done-timers">0</b></div>
    </div>
    <div id="timers-list"></div>
</section>




<!-- Контейнер раздела -->
<section id="achievements-section" style="display: none; padding: 16px; width: 100%; box-sizing: border-box;">
    <div class="ach-filter-nav" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="sub-tab active" onclick="setAchFilter('available', this)">Выполнимые</button>
        <button class="sub-tab" onclick="setAchFilter('locked', this)">Недоступные</button>
        <button class="sub-tab" onclick="setAchFilter('hidden', this)">Скрытые</button>
    </div>
    
    <div id="ach-counter" style="text-align: center; margin-bottom: 20px; color: #777; font-weight: bold;"></div>
    
    <div id="achievements-list"></div>
</section>


<div id="modal-global" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); z-index:20000; align-items:center; justify-content:center;">
    <div style="background:#11152c; padding:25px; border-radius:18px; border:1px solid #6d4aff; text-align:center; width: 85%; max-width: 320px;">
        <h3 id="modal-title" style="color:white; margin-bottom:15px;">Подтверждение</h3>
        <p id="modal-text" style="color:#ddd; margin-bottom:25px;">Вы уверены?</p>
        <div style="display: flex; gap: 10px;">
            <button id="btn-modal-no" style="flex:1; padding:12px; border-radius:10px; border:none; background:#2d3436; color:white;">Нет</button>
            <button id="btn-modal-yes" style="flex:1; padding:12px; border-radius:10px; border:none; background:#ff4a4a; color:white;">Да</button>
        </div>
    </div>
</div>

<div id="toast-container" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9999;"></div>



<section id="games-section" style="display: none;">
    <div id="games-container"></div>
</section>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="script.js"></script>

</body>
</html>
